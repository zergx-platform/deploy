# Development overlay for an isolated zergx copy (release: zergx-dev, ns: temp).
#
# Isolation model:
#   - hostPathRoot "": ephemeral — every volume is an emptyDir, so a pod/node
#     restart wipes ALL state (postgres, nats, buildkit cache, artifact
#     storage, repos). Clean slate by design.
#   - runtimeNamespace temp: sandbox/deployment tools act inside temp itself
#     (RBAC is release-namespaced; temp-user has no rights in zergxd and the
#     main release's sandboxes live there).
#   - Own infra (nats/postgres/selenium/jjlab/artifact/buildkitd) — the abc.*
#     bus, the databases and the jj workspaces are fully separate from the
#     zergx namespace.
#
# Shared, read-only:
#   - Service images: pinned to the CURRENT live tags (same versioned images
#     as the zergx namespace runs).
#   - Live artifact as a buildkit docker.io mirror: base images resolve
#     through it until the dev artifact warms up.
#   - Sandbox worker image: pulled from the live registry (k8s.workerImage
#     default stays absolute).
#
# Deploy:
#   helm --kube-context temp -n temp upgrade --install zergx-dev \
#     charts/zergx -f charts/zergx-dev-values.yaml

hostPathRoot: ""

k8s:
  runtimeNamespace: temp

builder:
  # builds in the dev copy push into ITS OWN (ephemeral) artifact registry
  registry: jj-lab.temp.svc.cluster.local

infra:
  buildkitd:
    extraMirrors:
      - jj-lab.temp.svc.cluster.local

# ---- temp (dev) registry overrides — base chart targets the prod zergx jjlab.
# dev builds/pulls from ITS OWN temp jjlab (built there, mirrors export to prod).
global:
  imageRegistry: jj-lab.temp.svc.cluster.local

jjlab:
  url: http://jj-lab.temp.svc.cluster.local
  registry: jj-lab.temp.svc.cluster.local

k8s:
  workerImage: jj-lab.temp.svc.cluster.local/root/zergx-worker:dev-09040616

builder:
  registry: jj-lab.temp.svc.cluster.local

services:
  flutter:
    image: jj-lab.temp.svc.cluster.local/root/zergx-flutter:dev-09040616
  platform:
    image: jj-lab.temp.svc.cluster.local/root/zergx-platform:dev-09040616
  artifact:
    image: jj-lab.temp.svc.cluster.local/root/go-registry@sha256:78574b905f9fc1c4ce6fc7209e2a04b817e5447836af2af04cf6d79ac73ba550
  jjlab:
    image: jj-lab.temp.svc.cluster.local/root/jj-lab:dev-09040616
  repo-extension:
    image: jj-lab.temp.svc.cluster.local/root/zergx-repo-extension:dev-09040616
  ops-extension:
    image: jj-lab.temp.svc.cluster.local/root/zergx-ops-extension:dev-09040616
  wdbidi-extension:
    image: jj-lab.temp.svc.cluster.local/root/zergx-wdbidi-extension:dev-09040616
  agent:
    image: jj-lab.temp.svc.cluster.local/root/zergx-agent:dev-09040616
  memory-tools:
    image: jj-lab.temp.svc.cluster.local/root/zergx-memory-extension:dev-09040616
infra:
  buildkitd:
    extraMirrors:
      - jj-lab.temp.svc.cluster.local
infra:
  postgres:
    image: jj-lab.temp.svc.cluster.local/root/postgres:18-alpine3.24
  nats:
    image: jj-lab.temp.svc.cluster.local/root/nats:2.14.5-alpine
  selenium:
    image: jj-lab.temp.svc.cluster.local/root/selenium:151.0-20260808
  buildkitd:
    image: jj-lab.temp.svc.cluster.local/root/buildkit:v0.32.2-rootless
