{{- /* Self-hosted infra with hostPath volumes (single-node). We avoid PV/PVC
       entirely because the deployer's ServiceAccount has no cluster-scoped
       PersistentVolume permission. Each service mounts <hostPathRoot>/<name>
       directly (DirectoryOrCreate). */ -}}

{{- if .Values.infra.postgres.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "zergx.labels" (dict "Chart" $.Chart "Release" $.Release "name" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "zergx.labels" (dict "Chart" $.Chart "Release" $.Release "name" "postgres") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.infra.postgres.image }}
          {{- if $.Values.global.httpProxy }}
          env:
            - name: HTTP_PROXY
              value: {{ $.Values.global.httpProxy | quote }}
            - name: HTTPS_PROXY
              value: {{ $.Values.global.httpProxy | quote }}
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc.cluster.local,.svc"
            - name: POSTGRES_USER
              value: {{ .Values.infra.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.infra.postgres.password | quote }}
          {{- else }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.infra.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.infra.postgres.password | quote }}
          {{- end }}
          resources:
            {{- toYaml $.Values.infraResources | nindent 12 }}
          ports:
            - name: pg
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          {{- if .Values.hostPathRoot }}
          hostPath:
            path: {{ .Values.hostPathRoot }}/postgres
            type: DirectoryOrCreate
          {{- else }}
          # ephemeral mode (hostPathRoot ""): emptyDir, wiped on restart
          emptyDir: {}
          {{- end }}
        - name: initdb
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "zergx.labels" (dict "Chart" $.Chart "Release" $.Release "name" "postgres-init") | nindent 4 }}
data:
  init.sql: |
    {{- range $db := .Values.infra.postgres.databases }}
    CREATE DATABASE {{ $db }};
    {{- end }}
{{- end }}

{{- if .Values.infra.nats.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    {{- include "zergx.labels" (dict "Chart" $.Chart "Release" $.Release "name" "nats") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    {{- include "zergx.labels" (dict "Chart" $.Chart "Release" $.Release "name" "nats") | nindent 4 }}
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: {{ .Values.infra.nats.image }}
          args:
            - "-js"
            - "-sd"
            - "/data/jetstream"
            - "-m"
            - "8222"
          resources:
            {{- toYaml $.Values.infraResources | nindent 12 }}
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.hostPathRoot }}
          hostPath:
            path: {{ .Values.hostPathRoot }}/nats
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}

{{- if .Values.infra.selenium.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: selenium
  labels:
    {{- include "zergx.labels" (dict "Chart" $.Chart "Release" $.Release "name" "selenium") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: selenium
  ports:
    - name: http
      port: 4444
      targetPort: 4444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium
  labels:
    {{- include "zergx.labels" (dict "Chart" $.Chart "Release" $.Release "name" "selenium") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selenium
  template:
    metadata:
      labels:
        app: selenium
    spec:
      containers:
        - name: selenium
          image: {{ .Values.infra.selenium.image }}
          env:
            - name: SE_ENABLE_MANAGED_DOWNLOADS
              value: "false"
            - name: SE_NODE_MAX_SESSIONS
              value: "8"
            - name: SE_NODE_OVERRIDE_MAX_SESSIONS
              value: "true"
          resources:
            {{- if .Values.infra.selenium.resources }}
            {{- toYaml .Values.infra.selenium.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.infraResources | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 4444
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
{{- end }}

{{- if .Values.infra.buildkitd.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  labels:
    {{- include "zergx.labels" (dict "Chart" $.Chart "Release" $.Release "name" "buildkitd") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: buildkitd
  ports:
    - name: grpc
      port: 1234
      targetPort: 1234
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buildkitd
  labels:
    {{- include "zergx.labels" (dict "Chart" $.Chart "Release" $.Release "name" "buildkitd") | nindent 4 }}
spec:
  serviceName: buildkitd
  replicas: 1
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
    spec:
      securityContext:
        fsGroup: 1000
      # The rootless buildkit image runs as uid 1000, but a hostPath created
      # with DirectoryOrCreate is owned by root. fsGroup does not apply to
      # hostPath volumes, so an init container chowns the data dir first.
      initContainers:
        - name: chown-buildkit-data
          image: {{ .Values.infra.buildkitd.image }}
          command: ["sh", "-c", "chown -R 1000:1000 /var/lib/buildkit"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            {{- toYaml .Values.infraResources | nindent 12 }}
          volumeMounts:
            - name: buildkit-data
              mountPath: /var/lib/buildkit
      containers:
        - name: buildkitd
          image: {{ .Values.infra.buildkitd.image }}
          securityContext:
            appArmorProfile:
              type: Unconfined
            seccompProfile:
              type: Unconfined
            capabilities:
              add:
                - SYS_ADMIN
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          args:
            - "--addr"
            - "tcp://0.0.0.0:1234"
            - "--oci-worker-no-process-sandbox"
            - "--root"
            - "/var/lib/buildkit"
            - "--config"
            - "/etc/buildkit/buildkitd.toml"
          env:
            - name: HTTP_PROXY
              value: {{ $.Values.global.httpProxy | quote }}
            - name: HTTPS_PROXY
              value: {{ $.Values.global.httpProxy | quote }}
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc.cluster.local,.svc,.nip.io"
          resources:
            {{- toYaml (default .Values.infraResources .Values.buildkitdResources) | nindent 12 }}
          ports:
            - name: grpc
              containerPort: 1234
          volumeMounts:
            - name: buildkit-config
              mountPath: /etc/buildkit/buildkitd.toml
              subPath: buildkitd.toml
            - name: buildkit-data
              mountPath: /var/lib/buildkit
      volumes:
        - name: buildkit-config
          configMap:
            name: buildkitd-config
        # Layer cache + content store live on the node (not the ephemeral
        # container fs), so builds are incremental across pod restarts and
        # chart upgrades. Single-node hostPath, same pattern as the other
        # infra services.
        - name: buildkit-data
          {{- if .Values.hostPathRoot }}
          hostPath:
            path: {{ .Values.hostPathRoot }}/buildkit
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  labels:
    {{- include "zergx.labels" (dict "Chart" $.Chart "Release" $.Release "name" "buildkitd-config") | nindent 4 }}
data:
    buildkitd.toml: |
      # Push + pull service/base images through the jjlab OCI registry (http,
      # insecure over the in-cluster service host). It pull-through-caches
      # docker.io library/* base images, so buildkit never hits docker.io.
      # Pushed built images target ${REGISTRY}/root/<service>:<tag>; builds
      # need a write token (basic auth x:<token>) to push to jjlab.
      [registry."{{ $.Values.global.imageRegistry }}"]
        http = true
        insecure = true
        {{- if .Values.jjlab.token }}
        auth = "{{ printf "x:%s" .Values.jjlab.token | b64enc }}"
        {{- end }}
{{- end }}
