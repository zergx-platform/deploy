apiVersion: v1
kind: Secret
metadata:
  name: zergx-external
  labels:
    {{- include "zergx.labels" (dict "Chart" .Chart "Release" .Release "name" "external") | nindent 4 }}
type: Opaque
stringData:
  ZERGX_PORT: "8080"
  ZERGX_SELF_BASE: {{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "artifact") }}/api/v1/packages
  ZERGX_HTTP_PROXY: {{ .Values.global.httpProxy | default "http://mihomo.develop.svc.cluster.local:7890" | quote }}
  ZERGX_ADMIN_TOKEN: {{ .Values.registryAdminToken | default "zergx_dev_admin" | quote }}
  {{- if .Values.infra.nats.enabled }}
  NATS_URL: nats://nats.{{ .Release.Namespace }}.svc.cluster.local:4222
  {{- else }}
  NATS_URL: {{ .Values.nats.url | quote }}
  {{- end }}
  {{- if .Values.infra.postgres.enabled }}
  POSTGRES_HOST: postgres.{{ .Release.Namespace }}.svc.cluster.local
  {{- else }}
  POSTGRES_HOST: {{ .Values.postgres.host | quote }}
  {{- end }}
  POSTGRES_PORT: {{ .Values.postgres.port | default "5432" | quote }}
  POSTGRES_USER: {{ .Values.infra.postgres.user | default .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.infra.postgres.password | default .Values.postgres.password | quote }}
  POSTGRES_DB_AGENT: {{ .Values.infra.postgres.databases.agent | default .Values.postgres.databases.agent | quote }}
  POSTGRES_DB_PLATFORM: {{ .Values.infra.postgres.databases.platform | default .Values.postgres.databases.platform | quote }}
  POSTGRES_DB_REPOEXT: {{ .Values.infra.postgres.databases.repoext | default .Values.postgres.databases.repoext | default "zergx_repoext" | quote }}
  ZERGX_RECONCILE_INTERVAL_SECS: {{ dig "reconcileIntervalSecs" 60 .Values.repoExtension | quote }}
  ZERGX_DATA_DIR: /data
  ZERGX_REPO_DB: /data/repo-manager.db
  ZERGX_AGENT_URL: {{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "agent") }}
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  ZERGX_LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  ZERGX_LLM_API_KEY: {{ .Values.llm.apiKey | default "" | quote }}
  ZERGX_LLM_MODEL: {{ .Values.llm.model | default "deepseek-v4-pro" | quote }}
  {{- if .Values.infra.selenium.enabled }}
  ZERGX_SELENIUM_URL: http://selenium.{{ .Release.Namespace }}.svc.cluster.local:4444
  {{- end }}
  {{- if .Values.infra.buildkitd.enabled }}
  ZERGX_BUILDKIT_ADDR: tcp://buildkitd.{{ .Release.Namespace }}.svc.cluster.local:1234
  {{- end }}
  ZERGX_REPO_MANAGER_URL: {{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "jjlab") }}
  ZERGX_REGISTRY: {{ .Values.builder.registry | default "artifact.zergx.svc.cluster.local" | quote }}
  ZERGX_REGISTRY_TOKEN: {{ .Values.registryToken | default "" | quote }}
  ZERGX_REPOS_ROOT: {{ .Values.repoManager.reposRoot | default "/home/user/.zergx/repos" | quote }}
  REPOS_ROOT: {{ .Values.repoManager.reposRoot | default "/home/user/.zergx/repos" | quote }}
  ZERGX_REPOEXT_URL: {{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "repo-extension") }}
  ZERGX_BROWSER_URL: {{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "wdbidi-extension") }}
  ZERGX_EXECUTOR_URL: {{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "ops-extension") }}
  ZERGX_BUILDER_URL: {{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "ops-extension") }}
  ZERGX_REGISTRY_URL: {{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "artifact") }}
  ZERGX_MEMORY_URL: {{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "memory-tools") }}
  ZERGX_WORKER_IMAGE: {{ .Values.k8s.workerImage | default "artifact.zergx.svc.cluster.local/zergx-worker:v0.0.1" | quote }}
  ZERGX_K8S_NAMESPACE: {{ .Values.k8s.runtimeNamespace | default "zergxd" | quote }}
  ZERGX_TOOL_SERVERS: "{{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "repo-extension") }},{{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "ops-extension") }},{{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "wdbidi-extension") }},{{ include "zergx.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "memory-tools") }}"
