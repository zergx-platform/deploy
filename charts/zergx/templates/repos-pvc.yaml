{{- if .Values.persistence.repos.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zergx-repos
  labels:
    {{- include "zergx.labels" (dict "Chart" .Chart "Release" .Release "name" "repos") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.repos.size }}
  resources:
    requests:
      storage: {{ .Values.persistence.repos.size }}
  {{- end }}
{{- end }}
