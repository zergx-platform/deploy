{{- /* ops-extension no longer touches the k8s API directly: every cluster
       operation (sandboxes, deployments, helm) goes through jjlab's /ops
       surface. The ServiceAccount is kept (deployment references it) but the
       Roles are no longer mounted with cluster permissions. */ -}}
{{- if (index .Values.services "ops-extension").enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-extension
  labels:
    {{- include "zergx.labels" (dict "Chart" .Chart "Release" .Release "name" "ops-extension") | nindent 4 }}
{{- end }}
