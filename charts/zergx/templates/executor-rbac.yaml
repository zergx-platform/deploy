{{- /* ops-extension's own namespace (release namespace = zergx, the platform/
       infrastructure namespace) only needs read access: all of its write
       operations (sandboxes, deployments, helm releases) target k8s.runtimeNamespace
       (zergxd, the develop environment). Write RBAC lives in runtime-rbac.yaml. */ -}}
{{- if (index .Values.services "ops-extension").enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-extension
  labels:
    {{- include "zergx.labels" (dict "Chart" .Chart "Release" .Release "name" "ops-extension") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-extension
  labels:
    {{- include "zergx.labels" (dict "Chart" .Chart "Release" .Release "name" "ops-extension") | nindent 4 }}
rules:
  # Read-only in the platform namespace: ops-extension may inspect but never
  # mutate zergx services.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "secrets", "configmaps", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-extension
  labels:
    {{- include "zergx.labels" (dict "Chart" .Chart "Release" .Release "name" "ops-extension") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-extension
subjects:
  - kind: ServiceAccount
    name: ops-extension
    namespace: {{ .Release.Namespace }}
{{- end }}
