{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zergx.fullname" (dict "Chart" $.Chart "Release" $.Release "name" $name) }}
  labels:
    {{- include "zergx.labels" (dict "Chart" $.Chart "Release" $.Release "name" $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "zergx.labels" (dict "Chart" $.Chart "Release" $.Release "name" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http{{- end }}
{{- end }}
