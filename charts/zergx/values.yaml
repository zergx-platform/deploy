global:
  imageRegistry: jj-lab.temp.svc.cluster.local
  imageTag: v0.0.1
  # HTTP(S) proxy used to pull public (docker.io) images in the infra pods.
  # e.g. http://mihomo.develop.svc.cluster.local:7890
  httpProxy: http://mihomo.develop.svc.cluster.local:7890

imagePullPolicy: Always

# Host path on the single cluster node where infra data lives. Must exist (or
# be creatable) on the node. Each infra service stores under
# <hostPathRoot>/<service-name>.
# hostPathRoot: per-service host data dirs (<root>/<name>). Empty string =
# ephemeral mode: every infra/app volume becomes an emptyDir, so a pod (or
# node) restart wipes ALL state (postgres, nats, buildkit cache, artifact
# storage, repos) — a clean-slate dev environment by design.
hostPathRoot: /home/develop/ZergX

# Internal service hostnames. When infra.<x>.enabled is true, the chart deploys
# the dependency inside this release and these hosts point at the in-chart
# Service (named by the services key, no prefix). Set enabled=false to reuse external services.
infra:
  postgres:
    enabled: true
    image: jj-lab.temp.svc.cluster.local/root/postgres:18-alpine3.24
    storage: 100Gi
    user: root
    password: devpassword
    databases:
      agent: zergx_agent
      platform: zergx_platform
      repoext: zergx_repoext
  nats:
    enabled: true
    image: jj-lab.temp.svc.cluster.local/root/nats:2.14.5-alpine
    storage: 100Gi
  selenium:
    enabled: true
    image: jj-lab.temp.svc.cluster.local/root/selenium:151.0-20260808
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
  buildkitd:
    enabled: true
    # Extra docker.io pull-through mirrors (in-cluster, plain HTTP). For a
    # dev deployment with an empty own artifact, point at the main release's
    # artifact so base images (node/golang/alpine) still resolve.
    extraMirrors: []
    image: jj-lab.temp.svc.cluster.local/root/buildkit:v0.32.2-rootless
    storage: 100Gi
    # Build cache + content store persist on the node under
    # <hostPathRoot>/buildkit (single-node hostPath, like the other infra
    # services). Enables incremental builds across restarts/chart upgrades.
nats:
  url: nats://nats.develop.svc.cluster.local:4222

postgres:
  host: postgres.develop.svc.cluster.local
  port: "5432"
  user: root
  password: devpassword
  databases:
    agent: zergx_agent
    platform: zergx_platform
    repoext: zergx_repoext

repoExtension:
  # Reconciler cadence (seconds): finish pending sagas, converge drift.
  reconcileIntervalSecs: 60


llm:
  baseUrl: http://tal-openai-proxy.develop.svc.cluster.local:4000/v1
  apiKey: ""
  model: deepseek-v4-pro

k8s:
  # runtimeNamespace is where ops-extension creates sandboxes and user
  # deployments. The platform services themselves live in the release
  # namespace (zergx); runtime workloads are isolated in zergxd.
  runtimeNamespace: zergxd
  workerImage: jj-lab.temp.svc.cluster.local/root/zergx-worker:v0.0.4

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# CPU/memory limits for the tool-server services (memory-tools). Kept tiny so the
# cumulative per-pod limits.cpu stays well under the temp-quota (32 cores).
toolResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "0.2"
    memory: 256Mi

# Names of the tool-server deployments, matched by the deployment template to
# apply toolResources.
toolServices:
  - memory-tools

registryResources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

infraResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

buildkitdResources:
  requests:
    cpu: 4
    memory: 16Gi
  limits:
    cpu: "8"
    memory: 128Gi

services:
  flutter:
    enabled: true
    port: 80
    containerPort: 8080
    # Flutter web client recreating the platform UI (nginx + built assets).
    image: jj-lab.temp.svc.cluster.local/root/zergx-flutter:v0.0.8
  platform:
    enabled: true
    port: 80
    containerPort: 8080
    # Go aggregate API + streaming reverse proxy + embedded SPA.
    image: jj-lab.temp.svc.cluster.local/root/zergx-platform:v0.0.11
  artifact:
    enabled: false  # retired: registry is now http://jj-lab.temp.svc.cluster.local
    port: 80
    containerPort: 8080
    # Go artifact registry (language protocols + OCI), replacing the Rust
    # registry. The artifact serves its own go-registry image (there is no
    # external source for this self-hosted image); the image is pre-pulled onto
    # the node kubelet so the artifact can cold-start via imagePullPolicy
    # IfNotPresent without any external bootstrap registry.
    #
    # The image is pinned by digest (not a floating tag) on purpose:
    # imagePullPolicy is IfNotPresent and the kubelet never re-resolves a
    # floating tag, so a rebuilt tag would never roll out. Bump this digest
    # whenever the go-registry image is rebuilt (buildctl push prints the
    # sha256).
    image: jj-lab.temp.svc.cluster.local/root/go-registry@sha256:78574b905f9fc1c4ce6fc7209e2a04b817e5447836af2af04cf6d79ac73ba550
  jjlab:
    enabled: false  # retired: jjlab is now http://jj-lab.temp.svc.cluster.local
    port: 80
    containerPort: 8080
    # Rust jj-lib native server (single static binary, no external git/jj).
    image: jj-lab.temp.svc.cluster.local/root/jj-lab:v0.3.17-http2
  repo-extension:
    enabled: true
    port: 80
    containerPort: 8080
    # Go NATS tool layer forwarding agent file/git tools to jjlab.
    image: jj-lab.temp.svc.cluster.local/root/zergx-repo-extension:v0.0.12
  ops-extension:
    enabled: true
    port: 80
    containerPort: 8080
    # Go single-binary extension: executor + sandbox-tools + builder + artifact-tools.
    image: jj-lab.temp.svc.cluster.local/root/zergx-ops-extension:v0.0.22  # prev v0.0.21
  wdbidi-extension:
    enabled: true
    port: 80
    containerPort: 8080
    # Browser tools over WebDriver BiDi (selenium standalone).
    image: jj-lab.temp.svc.cluster.local/root/zergx-wdbidi-extension:v0.0.9
  agent:
    enabled: true
    port: 80
    containerPort: 8080
    # The agent is the TypeScript implementation (Vercel AI SDK); the Rust
    # agent has been removed.
    image: jj-lab.temp.svc.cluster.local/root/zergx-agent:v0.0.13
  memory-tools:
    enabled: true
    port: 80
    containerPort: 8080
    # Go memory-extension (replaces the Rust memory-tools service).
    image: jj-lab.temp.svc.cluster.local/root/zergx-memory-extension:v0.0.9

builder:
  registry: jj-lab.temp.svc.cluster.local

repoManager:
  reposRoot: /home/user/.zergx/repos

# New jjlab (jj-lab) — the merged git-hosting + package-registry + ops server.
# platform/repo-extension/ops-extension point at it via ZERGX_JJ_SERVER_URL.
jjlab:
  url: http://jj-lab.temp.svc.cluster.local
  token: devtoken

registryToken: ""
registryAdminToken: "zergx_dev_admin"

# gatewayGoToken is the fixed pre-shared token the platform (zergx-platform) requires
# on every /api/v1/** request (Bearer). Set to a random value; empty disables
# platform auth (trusted-network only).
gatewayGoToken: "5H7q_K940ySbgXng7H3nNWTTweGcjhGmFSJwJnTAQRw"

# platformCredential is the single login credential (user:password) the
# platform accepts at POST /api/v1/auth/login in exchange for a signed token.
# Leave empty to disable login (gatewayGoToken-only auth).
platformCredential: "root:devpassword"

pullSecret:
  enabled: false
  name: zergx-pull
  dockerconfigjson: ""


