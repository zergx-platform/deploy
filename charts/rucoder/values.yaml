global:
  imageRegistry: rucoder-zot.temp.10.199.64.20.nip.io
  imageTag: dev
  # HTTP(S) proxy used to pull public (docker.io) images in the infra pods.
  # e.g. http://mihomo.develop.svc.cluster.local:7890
  httpProxy: http://mihomo.develop.svc.cluster.local:7890
  # Hostname the Zot OCI registry is exposed as (buildkitd insecure config).
  zotHost: rucoder-zot.temp.10.199.64.20.nip.io

imagePullPolicy: Always

# Host path on the single cluster node where infra data lives. Must exist (or
# be creatable) on the node. Each infra service stores under
# <hostPathRoot>/<service-name>.
hostPathRoot: /home/develop/Data

# Internal service hostnames. When infra.<x>.enabled is true, the chart deploys
# the dependency inside this release and these hosts point at the in-chart
# Service (rucoder-<x>). Set enabled=false to reuse external services.
infra:
  postgres:
    enabled: true
    image: rucoder-zot.temp.10.199.64.20.nip.io/postgres:18-alpine3.24
    storage: 100Gi
    user: root
    password: devpassword
    databases:
      agent: rucoder_agent
      platform: rucoder_platform
  nats:
    enabled: true
    image: rucoder-zot.temp.10.199.64.20.nip.io/nats:2.14.5-alpine
    storage: 100Gi
  browserless:
    enabled: true
    image: rucoder-zot.temp.10.199.64.20.nip.io/browserless:latest
  buildkitd:
    enabled: true
    image: rucoder-zot.temp.10.199.64.20.nip.io/buildkit-rootless:rootless
    storage: 100Gi
  zot:
    enabled: true
    image: rucoder-zot.temp.10.199.64.20.nip.io/zot:v2.1.4
    storage: 100Gi
nats:
  url: nats://nats.develop.svc.cluster.local:4222

postgres:
  host: postgres.develop.svc.cluster.local
  port: "5432"
  user: root
  password: devpassword
  databases:
    agent: rucoder_agent
    platform: rucoder_platform


llm:
  baseUrl: http://tal-openai-proxy.develop.svc.cluster.local:4000/v1
  apiKey: ""
  model: deepseek-v4-pro

k8s:
  namespace: temp
  workerImage: rucoder-zot.temp.10.199.64.20.nip.io/rucoder-worker:dev

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# CPU/memory limits for the tool-server services (browser-tools,
# sandbox-tools, artifact-tools, memory-tools). Kept tiny so the cumulative
# per-pod limits.cpu stays well under the temp-quota (32 cores).
toolResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "0.2"
    memory: 256Mi

# Names of the tool-server deployments, matched by the deployment template to
# apply toolResources.
toolServices:
  - browser-tools
  - sandbox-tools
  - artifact-tools
  - memory-tools

registryResources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

infraResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

buildkitdResources:
  requests:
    cpu: 1
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

zotResources:
  requests:
    cpu: 1
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

services:
  gateway:
    enabled: true
    port: 80
    containerPort: 8080
  registry:
    enabled: true
    port: 80
    containerPort: 8080
  repo:
    enabled: true
    port: 80
    containerPort: 8080
    # Rust jj-lib native server (single static binary, no external git/jj).
    image: rucoder-zot.temp.10.199.64.20.nip.io/rucoder-repo:dev
  executor:
    enabled: true
    port: 80
    containerPort: 8080
  agent:
    enabled: true
    port: 80
    containerPort: 8080
    # The agent is the TypeScript implementation (Vercel AI SDK); the Rust
    # agent has been removed.
    image: rucoder-zot.temp.10.199.64.20.nip.io/rucoder-agent-ts:dev
  browser:
    enabled: true
    port: 80
    containerPort: 8080
  builder:
    enabled: true
    port: 80
    containerPort: 8080
  browser-tools:
    enabled: true
    port: 80
    containerPort: 8080
  sandbox-tools:
    enabled: true
    port: 80
    containerPort: 8080
  artifact-tools:
    enabled: true
    port: 80
    containerPort: 8080
  memory-tools:
    enabled: true
    port: 80
    containerPort: 8080

persistence:
  repos:
    enabled: true
    size: 100Gi

browser:
  cdpUrl: http://browserless.develop.svc.cluster.local:3000

builder:
  registry: rucoder-zot.temp.10.199.64.20.nip.io

podman:
  url: http://podman.develop.svc.cluster.local:8080

repoManager:
  reposRoot: /home/user/.recoder/repos

registryToken: ""
registryAdminToken: "rxt_dev_admin"

pullSecret:
  enabled: false
  name: rucoder-pull
  dockerconfigjson: ""


