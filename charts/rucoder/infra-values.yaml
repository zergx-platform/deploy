# Standalone infrastructure dependencies deployed inside this chart instead of
# relying on external (develop-namespace) services.
infra:
  postgres:
    enabled: true
    image: postgres:16-alpine
    storage: 10Gi
    user: root
    password: devpassword
    databases:
      agent: rucoder_agent
      registry: rucoder_registry
      platform: rucoder_platform
  nats:
    enabled: true
    image: nats:2.10-alpine
    storage: 2Gi
  minio:
    enabled: true
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    storage: 20Gi
    accessKey: root
    secretKey: devpassword
    bucket: rucoder-blobs
  selenium:
    enabled: true
    image: rucoder-artifact.temp.10.199.64.20.nip.io/selenium/standalone-chromium:151.0-20260808
  buildkitd:
    enabled: true
    image: rucoder-artifact.temp.10.199.64.20.nip.io/moby/buildkit:v0.32.2-rootless
    storage: 10Gi
