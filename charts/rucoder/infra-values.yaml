# Standalone infrastructure dependencies deployed inside this chart instead of
# relying on external (develop-namespace) services.
infra:
  postgres:
    enabled: true
    image: postgres:16-alpine
    storage: 10Gi
    user: root
    password: devpassword
    databases:
      agent: rucoder_agent
      registry: rucoder_registry
      platform: rucoder_platform
  nats:
    enabled: true
    image: nats:2.10-alpine
    storage: 2Gi
  minio:
    enabled: true
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    storage: 20Gi
    accessKey: root
    secretKey: devpassword
    bucket: rucoder-blobs
  browserless:
    enabled: true
    image: browserless/chrome:latest
  buildkitd:
    enabled: true
    image: moby/buildkit:v0.13.2
    storage: 10Gi
