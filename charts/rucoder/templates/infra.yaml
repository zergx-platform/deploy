{{- /* Self-hosted infra with hostPath volumes (single-node). We avoid PV/PVC
       entirely because the deployer's ServiceAccount has no cluster-scoped
       PersistentVolume permission. Each service mounts <hostPathRoot>/<name>
       directly (DirectoryOrCreate). */ -}}

{{- if .Values.infra.postgres.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Chart.Name }}-postgres
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $.Chart.Name }}-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $.Chart.Name }}-postgres
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "postgres") | nindent 4 }}
spec:
  serviceName: {{ $.Chart.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ $.Chart.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ $.Chart.Name }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.infra.postgres.image }}
          {{- if $.Values.global.httpProxy }}
          env:
            - name: HTTP_PROXY
              value: {{ $.Values.global.httpProxy | quote }}
            - name: HTTPS_PROXY
              value: {{ $.Values.global.httpProxy | quote }}
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc.cluster.local,.svc"
            - name: POSTGRES_USER
              value: {{ .Values.infra.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.infra.postgres.password | quote }}
          {{- else }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.infra.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.infra.postgres.password | quote }}
          {{- end }}
          resources:
            {{- toYaml $.Values.infraResources | nindent 12 }}
          ports:
            - name: pg
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.hostPathRoot }}/postgres
            type: DirectoryOrCreate
        - name: initdb
          configMap:
            name: {{ $.Chart.Name }}-postgres-init
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Chart.Name }}-postgres-init
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "postgres-init") | nindent 4 }}
data:
  init.sql: |
    {{- range $db := .Values.infra.postgres.databases }}
    CREATE DATABASE {{ $db }};
    {{- end }}
{{- end }}

{{- if .Values.infra.nats.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Chart.Name }}-nats
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "nats") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $.Chart.Name }}-nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $.Chart.Name }}-nats
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "nats") | nindent 4 }}
spec:
  serviceName: {{ $.Chart.Name }}-nats
  replicas: 1
  selector:
    matchLabels:
      app: {{ $.Chart.Name }}-nats
  template:
    metadata:
      labels:
        app: {{ $.Chart.Name }}-nats
    spec:
      containers:
        - name: nats
          image: {{ .Values.infra.nats.image }}
          args:
            - "-js"
            - "-sd"
            - "/data/jetstream"
            - "-m"
            - "8222"
          resources:
            {{- toYaml $.Values.infraResources | nindent 12 }}
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.hostPathRoot }}/nats
            type: DirectoryOrCreate
{{- end }}

{{- if .Values.infra.browserless.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Chart.Name }}-browserless
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "browserless") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $.Chart.Name }}-browserless
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Chart.Name }}-browserless
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "browserless") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $.Chart.Name }}-browserless
  template:
    metadata:
      labels:
        app: {{ $.Chart.Name }}-browserless
    spec:
      containers:
        - name: browserless
          image: {{ .Values.infra.browserless.image }}
          {{- if $.Values.global.httpProxy }}
          env:
            - name: HTTP_PROXY
              value: {{ $.Values.global.httpProxy | quote }}
            - name: HTTPS_PROXY
              value: {{ $.Values.global.httpProxy | quote }}
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc.cluster.local,.svc"
          {{- end }}
          resources:
            {{- toYaml $.Values.infraResources | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
{{- end }}

{{- if .Values.infra.buildkitd.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Chart.Name }}-buildkitd
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "buildkitd") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $.Chart.Name }}-buildkitd
  ports:
    - name: grpc
      port: 1234
      targetPort: 1234
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $.Chart.Name }}-buildkitd
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "buildkitd") | nindent 4 }}
spec:
  serviceName: {{ $.Chart.Name }}-buildkitd
  replicas: 1
  selector:
    matchLabels:
      app: {{ $.Chart.Name }}-buildkitd
  template:
    metadata:
      labels:
        app: {{ $.Chart.Name }}-buildkitd
    spec:
      securityContext:
        fsGroup: 1000
      # The rootless buildkit image runs as uid 1000, but a hostPath created
      # with DirectoryOrCreate is owned by root. fsGroup does not apply to
      # hostPath volumes, so an init container chowns the data dir first.
      initContainers:
        - name: chown-buildkit-data
          image: {{ .Values.infra.buildkitd.image }}
          command: ["sh", "-c", "chown -R 1000:1000 /var/lib/buildkit"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            {{- toYaml .Values.infraResources | nindent 12 }}
          volumeMounts:
            - name: buildkit-data
              mountPath: /var/lib/buildkit
      containers:
        - name: buildkitd
          image: {{ .Values.infra.buildkitd.image }}
          securityContext:
            appArmorProfile:
              type: Unconfined
            seccompProfile:
              type: Unconfined
            capabilities:
              add:
                - SYS_ADMIN
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          args:
            - "--addr"
            - "tcp://0.0.0.0:1234"
            - "--oci-worker-no-process-sandbox"
            - "--root"
            - "/var/lib/buildkit"
            - "--config"
            - "/etc/buildkit/buildkitd.toml"
          env:
            - name: HTTP_PROXY
              value: {{ $.Values.global.httpProxy | quote }}
            - name: HTTPS_PROXY
              value: {{ $.Values.global.httpProxy | quote }}
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc.cluster.local,.svc,.nip.io"
          resources:
            {{- toYaml (default .Values.infraResources .Values.buildkitdResources) | nindent 12 }}
          ports:
            - name: grpc
              containerPort: 1234
          volumeMounts:
            - name: buildkit-config
              mountPath: /etc/buildkit/buildkitd.toml
              subPath: buildkitd.toml
            - name: buildkit-data
              mountPath: /var/lib/buildkit
      volumes:
        - name: buildkit-config
          configMap:
            name: {{ $.Chart.Name }}-buildkitd-config
        # Layer cache + content store live on the node (not the ephemeral
        # container fs), so builds are incremental across pod restarts and
        # chart upgrades. Single-node hostPath, same pattern as the other
        # infra services.
        - name: buildkit-data
          hostPath:
            path: {{ .Values.hostPathRoot }}/buildkit
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Chart.Name }}-buildkitd-config
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "buildkitd-config") | nindent 4 }}
data:
  buildkitd.toml: |
    # Pull docker.io images through the artifact OCI pull-through mirror over
    # plain HTTP on the in-cluster service host — no TLS/egress to docker.io
    # needed from buildkitd itself.
    [registry."docker.io"]
      mirrors = ["{{ include "rucoder.fullname" (dict "Chart" $.Chart "Release" $.Release "name" "artifact") }}.{{ $.Release.Namespace }}.svc.cluster.local:80"]

    [registry."{{ include "rucoder.fullname" (dict "Chart" $.Chart "Release" $.Release "name" "artifact") }}.{{ $.Release.Namespace }}.svc.cluster.local:80"]
      http = true
      insecure = true

    [registry."{{ $.Values.global.imageRegistry }}"]
      http = false
      insecure = true
{{- end }}
