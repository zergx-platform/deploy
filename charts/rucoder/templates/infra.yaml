      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Chart.Name }}-browserless
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "browserless") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $.Chart.Name }}-browserless
  template:
    metadata:
      labels:
        app: {{ $.Chart.Name }}-browserless
    spec:
      containers:
        - name: browserless
          image: {{ .Values.infra.browserless.image }}
          {{- if $.Values.global.httpProxy }}
          env:
            - name: HTTP_PROXY
              value: {{ $.Values.global.httpProxy | quote }}
            - name: HTTPS_PROXY
              value: {{ $.Values.global.httpProxy | quote }}
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc.cluster.local,.svc"
          {{- end }}
          resources:
            {{- toYaml $.Values.infraResources | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
{{- end }}

{{- if .Values.infra.buildkitd.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Chart.Name }}-buildkitd
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "buildkitd") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $.Chart.Name }}-buildkitd
  ports:
    - name: grpc
      port: 1234
      targetPort: 1234
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $.Chart.Name }}-buildkitd
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" "buildkitd") | nindent 4 }}
spec:
  serviceName: {{ $.Chart.Name }}-buildkitd
  replicas: 1
  selector:
    matchLabels:
      app: {{ $.Chart.Name }}-buildkitd
  template:
    metadata:
      labels:
        app: {{ $.Chart.Name }}-buildkitd
    spec:
      containers:
        - name: buildkitd
          image: {{ .Values.infra.buildkitd.image }}
          args:
            - "--addr"
            - "tcp://0.0.0.0:1234"
            - "--oci-worker-snapshotter"
            - "native"
          resources:
            {{- toYaml $.Values.infraResources | nindent 12 }}
          ports:
            - name: grpc
              containerPort: 1234
          volumeMounts:
            - name: data
              mountPath: /var/lib/buildkit
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.hostPathRoot }}/buildkitd
            type: DirectoryOrCreate
{{- end }}
