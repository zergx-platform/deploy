{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rucoder.fullname" (dict "Chart" $.Chart "Release" $.Release "name" $name) }}
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" $name) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" $name) | nindent 8 }}
    spec:
      {{- if eq $name "executor" }}
      serviceAccountName: {{ $.Chart.Name }}-executor
      {{- end }}
      containers:
        - name: {{ $name }}
          {{- if $svc.image }}
          image: {{ $svc.image }}
          {{- else }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Chart.Name }}-{{ $name }}:{{ $.Values.global.imageTag }}"
          {{- end }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort | default 8080 }}
          envFrom:
            - secretRef:
                name: {{ $.Chart.Name }}-external
          {{- if eq $name "repo-manager" }}
          volumeMounts:
            {{- if $.Values.persistence.repos.enabled }}
            - name: repos
              mountPath: /home/user/.recoder/repos
            {{- end }}
            - name: repo-manager-data
              mountPath: /data
          {{- end }}
          {{- if eq $name "registry" }}
          volumeMounts:
            - name: registry-data
              mountPath: /data
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- if eq $name "registry" }}
            {{- toYaml (default $.Values.resources $.Values.registryResources) | nindent 12 }}
            {{- else if has $name $.Values.toolServices }}
            {{- toYaml (default $.Values.resources $.Values.toolResources) | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.resources | nindent 12 }}
            {{- end }}
      {{- if eq $name "repo-manager" }}
      volumes:
        {{- if $.Values.persistence.repos.enabled }}
        - name: repos
          persistentVolumeClaim:
            claimName: {{ $.Chart.Name }}-repos
        {{- end }}
        - name: repo-manager-data
          hostPath:
            path: {{ $.Values.hostPathRoot }}/rucoder-repo-manager
            type: DirectoryOrCreate
      {{- end }}
      {{- if eq $name "registry" }}
      volumes:
        - name: registry-data
          hostPath:
            path: {{ $.Values.hostPathRoot }}/rucoder-registry
            type: DirectoryOrCreate
      {{- end }}
{{- end }}
{{- end }}
