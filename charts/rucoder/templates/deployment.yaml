{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rucoder.fullname" (dict "Chart" $.Chart "Release" $.Release "name" $name) }}
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" $name) | nindent 4 }}
spec:
  replicas: 1
  {{- if eq $name "artifact" }}
  # hostPath /data holds a bbolt db that only allows one writer: rolling
  # updates would leave old+new pods sharing the same lock and dead-loop.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" $name) | nindent 8 }}
    spec:
      {{- if eq $name "ops-extension" }}
      serviceAccountName: {{ $.Chart.Name }}-ops-extension
      {{- end }}
      containers:
        - name: {{ $name }}
          {{- if $svc.image }}
          image: {{ $svc.image }}
          {{- else }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Chart.Name }}-{{ $name }}:{{ $.Values.global.imageTag }}"
          {{- end }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          {{- if eq $name "artifact" }}
          args:
            - "-addr=0.0.0.0:{{ $svc.containerPort | default 5000 }}"
            - "-root=/data"
            - "-self-base=http://{{ include "rucoder.fullname" (dict "Chart" $.Chart "Release" $.Release "name" $name) }}.{{ $.Release.Namespace }}.svc.cluster.local"
            - "-upstream=https://docker.m.daocloud.io"
            - "-config=/config.yaml"
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort | default 8080 }}
          envFrom:
            - secretRef:
                name: {{ $.Chart.Name }}-external
          {{- if eq $name "repo" }}
          volumeMounts:
            - name: repos
              mountPath: /home/user/.recoder/repos
            - name: repo-manager-data
              mountPath: /data
          {{- end }}
          {{- if eq $name "artifact" }}
          volumeMounts:
            - name: artifact-data
              mountPath: /data
          {{- end }}
          {{- if ne $name "browser-extension" }}
          readinessProbe:
            httpGet:
              {{- if eq $name "artifact" }}
              path: /v2/
              {{- else }}
              path: /api/v1/health
              {{- end }}
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              {{- if eq $name "artifact" }}
              path: /v2/
              {{- else }}
              path: /api/v1/health
              {{- end }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- end }}
          resources:
            {{- if eq $name "artifact" }}
            {{- toYaml (default $.Values.resources $.Values.registryResources) | nindent 12 }}
            {{- else if has $name $.Values.toolServices }}
            {{- toYaml (default $.Values.resources $.Values.toolResources) | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.resources | nindent 12 }}
            {{- end }}
      {{- if eq $name "repo" }}
      volumes:
        - name: repos
          hostPath:
            path: {{ $.Values.hostPathRoot }}/rucoder-repos
            type: DirectoryOrCreate
        - name: repo-manager-data
          hostPath:
            path: {{ $.Values.hostPathRoot }}/rucoder-repo-manager
            type: DirectoryOrCreate
      {{- end }}
      {{- if eq $name "artifact" }}
      volumes:
        - name: artifact-data
          hostPath:
            path: {{ $.Values.hostPathRoot }}/rucoder-artifact
            type: DirectoryOrCreate
      {{- end }}
{{- end }}
{{- end }}
