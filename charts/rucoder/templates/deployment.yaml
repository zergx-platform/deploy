{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rucoder.fullname" (dict "Chart" $.Chart "Release" $.Release "name" $name) }}
  labels:
    {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" $name) | nindent 4 }}
spec:
  replicas: 1
  {{- if eq $name "artifact" }}
  # Artifact moved its metadata store from bbolt (single flock-holder) to
  # SQLite in WAL mode, so multiple pods can now open the same single-node
  # database — readers run concurrently, the writer queues on busy_timeout.
  # A rolling update no longer dead-locks on the flock.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rucoder.labels" (dict "Chart" $.Chart "Release" $.Release "name" $name) | nindent 8 }}
    spec:
      {{- if eq $name "ops-extension" }}
      serviceAccountName: {{ $.Chart.Name }}-ops-extension
      {{- end }}
      containers:
        - name: {{ $name }}
          {{- if $svc.image }}
          image: {{ $svc.image }}
          {{- else }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Chart.Name }}-{{ $name }}:{{ $.Values.global.imageTag }}"
          {{- end }}
          {{- if eq $name "artifact" }}
          # IfNotPresent: the registry serves its own image, so Always pull
          # dead-locks on cold start (kubelet pulls the image from the
          # registry, but the registry pod is the thing not yet running).
          # Rolling updates still work: the old pod keeps serving while the
          # new pod pulls.
          imagePullPolicy: IfNotPresent
          {{- else }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          {{- end }}
          {{- if eq $name "artifact" }}
          args:
            - "-addr=0.0.0.0:{{ $svc.containerPort | default 8080 }}"
            - "-root=/data"
            - "-self-base=http://{{ include "rucoder.fullname" (dict "Chart" $.Chart "Release" $.Release "name" $name) }}.{{ $.Release.Namespace }}.svc.cluster.local"
            - "-upstream=https://registry-1.docker.io"
            - "-config=/config.yaml"
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort | default 8080 }}
          envFrom:
            - secretRef:
                name: {{ $.Chart.Name }}-external
          {{- if eq $name "repo" }}
          env:
            - name: HTTP_PROXY
              value: {{ ($.Values.global.httpProxy) | default "http://mihomo.develop.svc.cluster.local:7890" | quote }}
            - name: HTTPS_PROXY
              value: {{ ($.Values.global.httpProxy) | default "http://mihomo.develop.svc.cluster.local:7890" | quote }}
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc.cluster.local,.svc,.nip.io,10.199.64.20,.develop.10.199.64.20.nip.io"
          {{- end }}
          {{- if eq $name "repo" }}
          volumeMounts:
            - name: repos
              mountPath: /home/user/.recoder/repos
            - name: repo-manager-data
              mountPath: /data
          {{- end }}
          {{- if eq $name "artifact" }}
          volumeMounts:
            - name: artifact-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          env:
            - name: HTTP_PROXY
              value: {{ ($.Values.global.httpProxy) | default "http://mihomo.develop.svc.cluster.local:7890" | quote }}
            - name: HTTPS_PROXY
              value: {{ ($.Values.global.httpProxy) | default "http://mihomo.develop.svc.cluster.local:7890" | quote }}
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc.cluster.local,.svc,.nip.io"
          {{- end }}
          readinessProbe:
            httpGet:
              {{- if eq $name "artifact" }}
              path: /v2/
              {{- else }}
              path: /api/v1/health
              {{- end }}
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              {{- if eq $name "artifact" }}
              path: /v2/
              {{- else }}
              path: /api/v1/health
              {{- end }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- if eq $name "artifact" }}
            {{- toYaml (default $.Values.resources $.Values.registryResources) | nindent 12 }}
            {{- else if has $name $.Values.toolServices }}
            {{- toYaml (default $.Values.resources $.Values.toolResources) | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.resources | nindent 12 }}
            {{- end }}
      {{- if eq $name "repo" }}
      volumes:
        - name: repos
          hostPath:
            path: {{ $.Values.hostPathRoot }}/rucoder-repos
            type: DirectoryOrCreate
        - name: repo-manager-data
          hostPath:
            path: {{ $.Values.hostPathRoot }}/rucoder-repo-manager
            type: DirectoryOrCreate
      {{- end }}
      {{- if eq $name "artifact" }}
      volumes:
        - name: artifact-data
          hostPath:
            path: {{ $.Values.hostPathRoot }}/rucoder-artifact
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
      {{- end }}
{{- end }}
{{- end }}
