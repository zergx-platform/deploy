apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-external
  labels:
    {{- include "rucoder.labels" (dict "Chart" .Chart "Release" .Release "name" "external") | nindent 4 }}
type: Opaque
stringData:
  RUCODER_PORT: "8080"
  RUCODER_SELF_BASE: "http://localhost:80/api/v1/packages"
  {{- if .Values.infra.nats.enabled }}
  NATS_URL: nats://{{ .Release.Name }}-nats.{{ .Release.Namespace }}.svc.cluster.local:4222
  {{- else }}
  NATS_URL: {{ .Values.nats.url | quote }}
  {{- end }}
  {{- if .Values.infra.postgres.enabled }}
  POSTGRES_HOST: {{ .Release.Name }}-postgres.{{ .Release.Namespace }}.svc.cluster.local
  {{- else }}
  POSTGRES_HOST: {{ .Values.postgres.host | quote }}
  {{- end }}
  POSTGRES_PORT: {{ .Values.postgres.port | default "5432" | quote }}
  POSTGRES_USER: {{ .Values.infra.postgres.user | default .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.infra.postgres.password | default .Values.postgres.password | quote }}
  POSTGRES_DB_AGENT: {{ .Values.infra.postgres.databases.agent | default .Values.postgres.databases.agent | quote }}
  POSTGRES_DB_REGISTRY: {{ .Values.infra.postgres.databases.registry | default .Values.postgres.databases.registry | quote }}
  POSTGRES_DB_PLATFORM: {{ .Values.infra.postgres.databases.platform | default .Values.postgres.databases.platform | quote }}
  {{- if .Values.infra.minio.enabled }}
  MINIO_ENDPOINT: http://{{ .Release.Name }}-minio.{{ .Release.Namespace }}.svc.cluster.local:9000
  MINIO_ACCESS_KEY: {{ .Values.infra.minio.accessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.infra.minio.secretKey | quote }}
  MINIO_BUCKET: {{ .Values.infra.minio.bucket | quote }}
  {{- else }}
  MINIO_ENDPOINT: {{ .Values.minio.endpoint | quote }}
  MINIO_ACCESS_KEY: {{ .Values.minio.accessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.secretKey | quote }}
  MINIO_BUCKET: {{ .Values.minio.bucket | quote }}
  {{- end }}
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  RUCODER_LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  RUCODER_LLM_API_KEY: {{ .Values.llm.apiKey | default "" | quote }}
  RUCODER_LLM_MODEL: {{ .Values.llm.model | default "deepseek-v4-pro" | quote }}
  {{- if .Values.infra.browserless.enabled }}
  RUCODER_CDP_URL: http://{{ .Release.Name }}-browserless.{{ .Release.Namespace }}.svc.cluster.local:3000
  {{- else }}
  RUCODER_CDP_URL: {{ .Values.browser.cdpUrl | default "http://browserless.develop.svc.cluster.local:3000" | quote }}
  {{- end }}
  {{- if .Values.infra.buildkitd.enabled }}
  RUCODER_BUILDKIT_ADDR: tcp://{{ .Release.Name }}-buildkitd.{{ .Release.Namespace }}.svc.cluster.local:1234
  {{- end }}
  RUCODER_REPO_MANAGER_URL: {{ include "rucoder.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "repo-manager") }}
  RUCODER_REGISTRY: {{ .Values.builder.registry | default "recoder-dev002.develop.10.199.64.20.nip.io" | quote }}
  RUCODER_REGISTRY_TOKEN: {{ .Values.registryToken | default "" | quote }}
  RENEX_REPOS_ROOT: {{ .Values.repoManager.reposRoot | default "/home/user/.recoder/repos" | quote }}
  RUCODER_BROWSER_URL: {{ include "rucoder.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "browser") }}
  RUCODER_EXECUTOR_URL: {{ include "rucoder.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "executor") }}
  RUCODER_BUILDER_URL: {{ include "rucoder.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "builder") }}
  RUCODER_REGISTRY_URL: {{ include "rucoder.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "registry") }}
  RUCODER_MEMORY_URL: {{ include "rucoder.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "memory-tools") }}
  RUCODER_WORKER_IMAGE: {{ .Values.k8s.workerImage | default "recoder-dev002.develop.10.199.64.20.nip.io/rucoder-worker:dev" | quote }}
  RUCODER_TOOL_SERVERS: "{{ include "rucoder.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "repo-tools") }},{{ include "rucoder.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "sandbox-tools") }},{{ include "rucoder.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "browser-tools") }},{{ include "rucoder.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "artifact-tools") }},{{ include "rucoder.svcUrl" (dict "Chart" .Chart "Release" .Release "name" "memory-tools") }}"
